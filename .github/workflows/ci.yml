name: Validate Bubble Space v2

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check and build
        id: compile
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Export V20 review dataset
        if: steps.compile.outcome == 'success'
        run: node scripts/export-curriculum-v20-review-dataset.mjs

      - name: Upload V20 review dataset
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: v20-review-dataset
          path: v20-review-export.json
          retention-days: 3

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Report build failure
        if: steps.compile.outcome == 'failure'
        run: |
          tail -n 120 build.log
          exit 1
